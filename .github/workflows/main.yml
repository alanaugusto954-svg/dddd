
name: Build Golden Hands

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar mod
        working-directory: GoldenHands-Fabric-1.21.11
        run: chmod +x gradlew && ./gradlew build

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHands-Fabric-1.21.11
          path: GoldenHands-Fabric-1.21.11/build/libs/*.jar
          if-no-files-found: error
