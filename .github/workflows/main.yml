
name: Build Golden Hands

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GoldenHands-Fabric-1.21.11

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Compilar mod
        run: gradle build

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHands-Fabric-1.21.11
          path: GoldenHands-Fabric-1.21.11/build/libs/*.jar
          if-no-files-found: error
